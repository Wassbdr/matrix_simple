# MLflow tracking server + model registry for the RCA pipeline.
#
# Deliberately simple for a single-user demo cluster: SQLite backend store +
# local artifact store, both on ONE PVC. SQLite is single-writer, so:
#   - replicas: 1
#   - strategy: Recreate (never two pods writing the DB at once)
# The "what I'd do at scale" path (Postgres backend + object-store artifacts)
# is documented in docs/OPERATIONS.md.
#
# Apply:  kubectl apply -f deploy/mlflow/mlflow.yaml
# UI:     kubectl -n mlops port-forward svc/mlflow 5000:5000
---
apiVersion: v1
kind: Namespace
metadata:
  name: mlops
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
  namespace: mlops
spec:
  accessModes: ["ReadWriteOnce"]
  # No storageClassName: use the cluster's default StorageClass, so the chart
  # is portable (RKE2 local-path, Harvester, etc.) instead of hard-coding one
  # cluster's class name. Override with `kubectl ... -p` if a specific class
  # (e.g. faster SSD) is required.
  resources:
    requests:
      storage: 5Gi
---
# CLIENT credentials for MLflow basic-auth. IMPORTANT: with --app-name=basic-auth
# the server keeps its OWN user DB, bootstrapped with a default admin
# (admin/password). These env vars are what CLIENTS send, not what the server
# accepts - so this user/password MUST match a user that exists in the server's
# auth DB. For the sandbox we align on the built-in admin; in a real setup,
# create a dedicated user post-deploy (mlflow.server.auth API / UI) and rotate
# the admin password, sourcing this secret from a sealed-secret / vault.
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-basic-auth
  namespace: mlops
type: Opaque
stringData:
  MLFLOW_TRACKING_USERNAME: admin
  MLFLOW_TRACKING_PASSWORD: password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops
  labels:
    app: mlflow
    component: tracking
spec:
  replicas: 1
  strategy:
    type: Recreate           # SQLite single-writer: no rolling overlap
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
        component: tracking
    spec:
      securityContext:
        # The official mlflow image runs as root, which can already write the
        # PVC. fsGroup is set so the mount stays group-writable if a future
        # image switches to a non-root uid (gid 1000) - harmless under root.
        fsGroup: 1000
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.16.2
          command: ["mlflow", "server"]
          args:
            - "--host=0.0.0.0"
            - "--port=5000"
            - "--backend-store-uri=sqlite:////mlflow/mlflow.db"
            - "--artifacts-destination=/mlflow/artifacts"
            - "--serve-artifacts"
            - "--app-name=basic-auth"
            # Single gunicorn worker: SQLite is single-writer anyway, and 4
            # default workers OOM-killed the pod at 512Mi on a loaded cluster.
            - "--workers=1"
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - secretRef:
                name: mlflow-basic-auth
          volumeMounts:
            - name: data
              mountPath: /mlflow
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          # TCP probes, not httpGet /health: with --app-name=basic-auth the
          # /health endpoint can require auth and return 401, which would
          # crashloop the pod on a probe that has nothing to do with health.
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 45
            periodSeconds: 20
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mlflow-data
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlops
  labels:
    app: mlflow
spec:
  type: ClusterIP
  selector:
    app: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: 5000
