[project]
name = "matrix-simple-rca"
version = "0.1.0"
description = "RCA pipeline (STA / Late-Bottleneck) with ObservIT + RCAEval benchmarks."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.0.0",
  "torch_geometric>=2.4.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "scikit-learn>=1.3.0",
  "requests>=2.31.0",
  "networkx>=3.1.0",
  "locust>=2.20.0",
  "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "numpy>=1.24.0",
  "torch>=2.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rca_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

