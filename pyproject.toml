[project]
name = "matrix-simple-rca"
version = "0.3.0"
description = "Root-cause ranking for microservice incidents from metrics exports."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Wassim Badraoui" },
]
keywords = ["root-cause-analysis", "gnn", "kubernetes", "observability", "stgcn", "gib"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "torch>=2.0.0",
  "torch_geometric>=2.4.0",
  "numpy>=1.24.0,<2",
  "pandas>=2.0.0",
  "scikit-learn>=1.3.0",
  "requests>=2.31.0",
  "networkx>=3.1.0",
  "matplotlib>=3.7.0",
  # YAML + validated config layer for all CLI entry points (rca_pipeline/config.py)
  "pydantic>=2.9.0",
  "pyyaml>=6.0",
]

[project.scripts]
rca = "rca_pipeline.cli:main"

[project.urls]
Repository = "https://github.com/Wassbdr/matrix_simple"
Documentation = "https://github.com/Wassbdr/matrix_simple/tree/showcase/2026-11/docs"

[project.optional-dependencies]
data = ["huggingface-hub>=0.25", "pyarrow>=14"]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  # TestClient transport for serving tests
  "httpx>=0.27.0",
]
# Load generation for live K8s data collection (not needed for benchmarks)
k8s = [
  "locust>=2.20.0",
]
# Hyperparameter optimization
hpo = [
  "optuna>=3.6.0",
]
# Experiment tracking + model registry (MLflow). Optional: the tracking
# wrapper (rca_pipeline/tracking.py) is a no-op when mlflow is absent.
tracking = [
  "mlflow>=2.15.0",
]
# Batch data-drift monitoring (Evidently). The drift job degrades to a
# built-in PSI fallback when evidently is absent.
monitoring = [
  "evidently>=0.4.0",
  "pyarrow>=14.0.0",
]
# Inference serving (REST API + Prometheus metrics)
serve = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "prometheus-fastapi-instrumentator>=7.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rca_pipeline"]

[tool.setuptools.package-data]
rca_pipeline = ["re1.pt", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
  ".venv", "build", "dist", "*.egg-info",
  "rcaeval", "checkpoints", "datasets",
  "rca_pipeline/checkpoints", "rca_pipeline/datasets",
  "rca_pipeline/validation_runs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Stylistic-only rules deferred to a dedicated cleanup PR.
# Keep real-bug rules (B023 loop-variable-capture, F841 unused-var, F821 undefined-name, E741) active.
ignore = [
  "E501",   # line-too-long: handled case-by-case in research code
  "UP006",  # non-pep585-annotation: requires py3.9+ runtime guards
  "UP007",  # non-pep604-annotation
  "UP035",  # deprecated-import (typing.List etc.)
  "UP045",  # non-pep604-annotation-optional
  "E402",   # module-import-not-at-top: needed for sys.path tweaks in a few entry points
  "B007",   # unused-loop-control-variable
  "F541",   # f-string-missing-placeholders: harmless
  # Below: low-risk findings tracked for a dedicated cleanup PR.
  "F841",   # unused-variable (mostly leftover assignments from refactors)
  "B023",   # function-uses-loop-variable (false positives: eps is a local constant)
  "E741",   # ambiguous-variable-name (single-letter ML conventions: l, I, etc.)
  "B008",   # function-call-in-default-argument
  "E702",   # multiple-statements-on-one-line-semicolon
  "UP031",  # printf-string-formatting
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["rca_pipeline/tests", "serving/tests"]
addopts = "-q --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]

[tool.coverage.run]
source = ["rca_pipeline", "serving"]
omit = [
  "rca_pipeline/tests/*",
  "serving/tests/*",
  "rca_pipeline/make_figures*.py",
  "rca_pipeline/locustfile_*.py",
]

[tool.coverage.report]
precision = 1
show_missing = false
skip_covered = false
# Ratchet: baseline 18.2% (2026-06) minus a small margin. Raise as tests grow.
fail_under = 16
