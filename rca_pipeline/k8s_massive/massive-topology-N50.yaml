apiVersion: v1
kind: Namespace
metadata:
  name: rca-sandbox
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-000
  namespace: rca-sandbox
  labels:
    app: core-000
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core-000
  template:
    metadata:
      labels:
        app: core-000
    spec:
      containers:
      - name: core-000
        image: rca-dummy-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: SERVICE_NAME
          value: core-000
        - name: UPSTREAMS
          value: "http://core-001.rca-sandbox.svc.cluster.local:8000/api/data,http://core-002.rca-sandbox.svc.cluster.local:8000/api/data,http://core-004.rca-sandbox.svc.cluster.local:8000/api/data,http://core-007.rca-sandbox.svc.cluster.local:8000/api/data"
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: core-000
  namespace: rca-sandbox
spec:
  selector:
    app: core-000
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
