# One-command local demo: FastAPI STA service with the bundled Sock Shop demo model.
#   docker compose up --build -d
#   python scripts/demo_predict.py        # sends examples/sockshop_demo/incident.json to /predict
services:
  rca-api:
    build:
      context: .
      dockerfile: serving/Dockerfile
    image: matrix-simple-rca:local
    ports:
      - "8080:8080"
    environment:
      MODEL_BUNDLE: /app/checkpoints/sta_sockshop_demo
      OMP_NUM_THREADS: "1"  # batch-1 inference: one thread avoids CPU oversubscription
    volumes:
      - ./examples/sockshop_demo/bundle:/app/checkpoints/sta_sockshop_demo:ro
