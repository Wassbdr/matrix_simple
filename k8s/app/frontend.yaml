##############################################
# Frontend Nginx — ConfigMap + Deployment + Service
##############################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: rca-sandbox
data:
  default.conf: |
    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
        }

        location /api/ {
            proxy_pass http://backend.rca-sandbox.svc.cluster.local:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /auth/ {
            proxy_pass http://auth.rca-sandbox.svc.cluster.local:8081/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /stub_status {
            stub_status on;
            access_log off;
        }
    }
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>RCA Lab Frontend</title>
        <style>
            body { font-family: 'Segoe UI', sans-serif; padding: 2rem; background: #1a1a2e; color: #e0e0e0; }
            h1 { color: #00d2ff; }
            .card { border: 1px solid #333; padding: 1rem; border-radius: 8px; background: #16213e; margin-bottom: 1rem; }
            .status { font-size: 0.85rem; color: #888; margin-top: 0.5rem; }
            pre { white-space: pre-wrap; word-wrap: break-word; color: #0f9; }
            .error { color: #f44; }
        </style>
    </head>
    <body>
        <h1>🔬 RCA Sandbox — Frontend</h1>
        <div class="card">
            <h3>Backend Status</h3>
            <pre id="result">Loading...</pre>
            <div class="status" id="timestamp"></div>
        </div>
        <script>
            function fetchData() {
                const start = performance.now();
                fetch('/auth/verify')
                    .then(authResponse => {
                        if (!authResponse.ok) throw new Error('Auth HTTP ' + authResponse.status);
                        return fetch('/api/data');
                    })
                    .then(response => {
                        if (!response.ok) throw new Error('Backend HTTP ' + response.status);
                        return response.json();
                    })
                    .then(data => {
                        const elapsed = (performance.now() - start).toFixed(0);
                        document.getElementById('result').textContent = JSON.stringify(data, null, 2);
                        document.getElementById('result').className = '';
                        document.getElementById('timestamp').textContent =
                            'Last update: ' + new Date().toLocaleTimeString() + ' | RTT: ' + elapsed + 'ms';
                    })
                    .catch(error => {
                        document.getElementById('result').textContent = 'Error: ' + error.message;
                        document.getElementById('result').className = 'error';
                        document.getElementById('timestamp').textContent =
                            'Failed at: ' + new Date().toLocaleTimeString();
                    });
            }
            fetchData();
            setInterval(fetchData, 5000);
        </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: rca-sandbox
  labels:
    app: frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: frontend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/stub_status"
    spec:
      containers:
      - name: frontend
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /nginx-health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /nginx-health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 3
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        - name: config
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
      volumes:
      - name: config
        configMap:
          name: frontend-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: rca-sandbox
  labels:
    app: frontend
    tier: frontend
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: ClusterIP
