apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: rca-sandbox
  labels:
    app: cache
    tier: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
        tier: cache
    spec:
      containers:
      - name: redis
        image: redis:6.2-alpine
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: rca-sandbox
  labels:
    app: cache
    tier: cache
spec:
  selector:
    app: cache
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  type: ClusterIP
