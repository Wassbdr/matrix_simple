apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-script
  namespace: rca-sandbox
data:
  main.py: |
    from fastapi import FastAPI, HTTPException
    from prometheus_fastapi_instrumentator import Instrumentator
    import time
    import logging

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    app = FastAPI(title="RCA Auth API")

    Instrumentator().instrument(app).expose(app)

    @app.get("/")
    def read_root():
        return {"status": "ok", "message": "Auth is running"}

    @app.get("/health")
    def health_check():
        return {"status": "healthy"}

    @app.get("/verify")
    def verify_auth():
        # Simulate auth latency
        time.sleep(0.01)
        return {"status": "authorized"}

  requirements.txt: |
    fastapi==0.104.1
    uvicorn==0.24.0
    prometheus-fastapi-instrumentator==6.1.0
    opentelemetry-distro==0.42b0
    opentelemetry-exporter-otlp==1.21.0
    opentelemetry-instrumentation-fastapi==0.42b0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: rca-sandbox
  labels:
    app: auth
    tier: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
        tier: auth
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
      - name: install-deps
        image: python:3.9-slim
        command:
        - sh
        - -c
        - |
          pip install --target=/deps -r /app/requirements.txt
        volumeMounts:
        - name: script
          mountPath: /app
        - name: deps
          mountPath: /deps
      containers:
      - name: auth
        image: python:3.9-slim
        command:
        - sh
        - -c
        - |
          export PYTHONPATH=/deps:$PYTHONPATH
          export PATH=/deps/bin:$PATH
          opentelemetry-instrument \
            --traces_exporter otlp \
            --metrics_exporter none \
            --service_name auth-service \
            uvicorn main:app --host 0.0.0.0 --port 8081
        ports:
        - containerPort: 8081
          name: http
        env:
        - name: OTEL_SERVICE_NAME
          value: "auth-service"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://rca-jaeger-collector.rca-sandbox.svc.cluster.local:4317"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "grpc"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 5
        volumeMounts:
        - name: script
          mountPath: /app
        - name: deps
          mountPath: /deps
        workingDir: /app
      volumes:
      - name: script
        configMap:
          name: auth-script
      - name: deps
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: rca-sandbox
  labels:
    app: auth
    tier: auth
spec:
  selector:
    app: auth
  ports:
  - port: 8081
    targetPort: 8081
    name: http
  type: ClusterIP
