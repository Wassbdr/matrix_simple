##############################################
# StressChaos -- Fuite de Memoire (Cache)
# Cible : Pod Redis
# Consomme 128MB de RAM avec 2 workers.
# Provoquera des lags GC sans tuer le pod.
##############################################
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: stress-mem-cache
  namespace: rca-sandbox
  labels:
    experiment: stress-mem-cache
    project: rca-research
spec:
  mode: all
  selector:
    namespaces:
      - rca-sandbox
    labelSelectors:
      app: cache
  stressors:
    memory:
      workers: 2
      size: "128MB"
  duration: "5m"
