---
# =====================================================================
# AlertmanagerConfig CRD : route les alertes "RCAStaServeRootCauseDetected"
# (emises par rca-watcher) ET les alertes de sante (PrometheusRule) vers
# un webhook.
#
# Pourquoi webhook plutot qu'email :
#   Le relais SMTP interne (smtp.devoteam.com:25) refuse le RCPT vers
#   @devoteam.com sans authentification ("554 5.7.1 Relay access denied")
#   et aucun compte SMTP authentifie n'est dispo pour la demo. Un webhook
#   contourne ce blocage : la requete sortante HTTPS est autorisee depuis
#   le cluster, et le service de notification (ntfy / Slack / Discord /
#   Teams) reste hors infrastructure Devoteam.
#
# Cible par defaut : ntfy.sh
#   - service public gratuit, sans compte
#   - URL = https://ntfy.sh/<TOPIC>  -- choisis un TOPIC unique (sinon
#     n'importe qui peut lire) et inscris-y l'app ntfy sur ton tel
#     (Android/iOS) OU laisse https://ntfy.sh/<TOPIC> ouvert dans un
#     onglet.
#   - REMPLACE `wassim-rca-ae47c51eb01cd276` ci-dessous par un slug a toi
#     (idealement long et imprevisible, ex.
#      `wassim-rca-7f4a9c2e1b8d`).
#
# Apply :
#   kubectl apply -f serving/alertmanager-config.yaml
#
# Test :
#   kubectl apply -f k8s/chaos/sockshop/stress-mem-carts.yaml
#   # ~90s plus tard, la notif arrive sur ntfy.sh/<TOPIC>
#   kubectl delete -f k8s/chaos/sockshop/stress-mem-carts.yaml
# =====================================================================
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: rca-email-route
  namespace: monitoring
  labels:
    alertmanagerConfig: rca
spec:
  # ------- Route -------
  route:
    receiver: rca-webhook
    groupBy: ['alertname', 'root_cause']
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    matchers:
      - name: alertname
        matchType: "=~"
        value: "RCAStaServe.*"

  # ------- Receivers -------
  receivers:
    - name: rca-webhook
      webhookConfigs:
        # Webhook -> rca-watcher /ntfy-relay : le watcher reformate le
        # payload AM en push ntfy lisible (titre, emoji, priorite). Le
        # topic ntfy est configure dans le deployment du watcher
        # (env NTFY_TOPIC). Cf. serving/k8s-watcher.yaml.
        - url: 'http://rca-watcher.rca-sandbox.svc.cluster.local:8090/ntfy-relay'
          sendResolved: true

          # ---------------------------------------------------------------
          # Exemples alternatifs (decommente celui que tu veux utiliser,
          # commente le bloc ntfy ci-dessus). Tous ont besoin d'une URL
          # creee depuis l'interface du service.
          #
          # SLACK incoming webhook (cree dans ton workspace) :
          #   - url: 'https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX'
          #     sendResolved: true
          #
          # DISCORD webhook (Channel -> Edit Channel -> Integrations) :
          #   - url: 'https://discord.com/api/webhooks/123456789012345678/AbCdEfGhIjKlMnOpQrStUvWxYz'
          #     sendResolved: true
          #     # Discord exige `/slack` a la fin pour parser le payload AM :
          #     # ou utilise un AlertmanagerConfig + un proxy. Le plus simple
          #     # = pointer vers https://.../api/webhooks/.../slack
          #
          # MS TEAMS via "Incoming Webhook" sur un canal :
          #   - url: 'https://outlook.office.com/webhook/<guid>@<guid>/IncomingWebhook/<id>/<id>'
          #     sendResolved: true
          # ---------------------------------------------------------------

# Pas de Secret necessaire pour ntfy.sh public.
# Si tu passes a un webhook authentifie (Slack avec basic auth, Teams
# avec token), il faudra ajouter un `httpConfig.bearerTokenSecret` ou
# `httpConfig.basicAuth` ici, plus un Secret kubectl correspondant.
