---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rca-watcher
  namespace: rca-sandbox
  labels:
    app: rca-watcher
    component: alerting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rca-watcher
  template:
    metadata:
      labels:
        app: rca-watcher
        component: alerting
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: watcher
          image: localhost:30500/rca-sta-watcher:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: PROMETHEUS_URL
              value: http://prometheus-server.monitoring-metrics.svc.cluster.local
            - name: INFERENCE_URL
              value: http://rca-sta-serve.rca-sandbox.svc.cluster.local:8080
            - name: ALERTMANAGER_URL
              # Cible l'Alertmanager operator-managee : c'est celui dans
              # lequel l'AlertmanagerConfig (serving/alertmanager-config.yaml)
              # injecte le receiver email (cf. `to:` dans ce fichier).
              value: http://monitoring-kube-prometheus-alertmanager.monitoring.svc.cluster.local:9093
            - name: TARGET_NAMESPACE
              value: sock-shop
            - name: POLL_INTERVAL_S
              value: "60"
            - name: WINDOW_SECONDS
              value: "360"
            - name: STEP_SECONDS
              value: "30"
            # Seuils calibres sur la distribution des scores live observee sur
            # le cluster (typiquement [-1, +1]). Le defaut 5.0 du code python
            # correspond au regime synthetique (4-7), pas au live.
            - name: CONFIDENCE_THRESHOLD
              value: "-0.5"
            - name: ERROR_RATE_TRIGGER
              value: "0.0"
            - name: TOP_K
              value: "3"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          startupProbe:
            httpGet: { path: /health, port: 8090 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /health, port: 8090 }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: rca-watcher
  namespace: rca-sandbox
  labels:
    app: rca-watcher
spec:
  type: ClusterIP
  selector:
    app: rca-watcher
  ports:
    - name: http
      port: 8090
      targetPort: 8090
      protocol: TCP
---
# PodMonitor pour Prometheus operator-managee
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: rca-watcher
  namespace: monitoring
  labels:
    release: monitoring
    app: rca-watcher
spec:
  namespaceSelector:
    matchNames: [ rca-sandbox ]
  selector:
    matchLabels:
      app: rca-watcher
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
